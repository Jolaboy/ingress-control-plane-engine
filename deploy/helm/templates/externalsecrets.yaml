{{- if .Values.externalSecrets.enabled }}
# ============================================================================
# External Secrets Operator integration.
#
# Syncs sensitive material (e.g. the JWT signing/verification key used by the
# OPA policy) from AWS Secrets Manager — backed by AWS KMS — into a native
# Kubernetes Secret. Authentication uses the controller ServiceAccount via
# IRSA (IAM Roles for Service Accounts), so no static AWS credentials are
# stored in the cluster.
# ============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "icpe.fullname" . }}-aws-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "icpe.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "icpe.serviceAccountName" . }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "icpe.fullname" . }}-jwt-signing
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "icpe.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ include "icpe.fullname" . }}-aws-secrets
    kind: SecretStore
  target:
    name: {{ .Values.externalSecrets.targetSecretName }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- if .property }}
        property: {{ .property }}
        {{- end }}
    {{- end }}
{{- end }}
