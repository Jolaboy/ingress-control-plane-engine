apiVersion: v1
kind: Service
metadata:
  name: control-plane-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "icpe.controller.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "icpe.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: xds-grpc
      port: {{ .Values.controller.xdsPort }}
      targetPort: xds-grpc
      protocol: TCP
    - name: metrics
      port: {{ .Values.controller.metricsPort }}
      targetPort: metrics
      protocol: TCP
