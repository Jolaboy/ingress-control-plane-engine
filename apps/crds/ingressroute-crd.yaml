apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ingressroutes.platform.internal
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  labels:
    app.kubernetes.io/name: ingress-control-plane-engine
    app.kubernetes.io/component: crd
spec:
  group: platform.internal
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Prefix
          type: string
          jsonPath: .spec.prefix
        - name: Service
          type: string
          jsonPath: .spec.serviceName
        - name: Port
          type: integer
          jsonPath: .spec.servicePort
        - name: Auth
          type: boolean
          jsonPath: .spec.authRequired
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - prefix
                - serviceName
                - servicePort
              properties:
                prefix:
                  type: string
                  description: >
                    URL path prefix this route matches on (e.g. /api/v1/orders).
                    Must start with /.
                  pattern: '^/'
                serviceName:
                  type: string
                  description: Name of the Kubernetes Service to forward traffic to.
                servicePort:
                  type: integer
                  description: Port on the target Service.
                  minimum: 1
                  maximum: 65535
                authRequired:
                  type: boolean
                  description: >
                    When true, Envoy ext_authz filter will evaluate the OPA
                    policy before forwarding the request.
                  default: false
                retryPolicy:
                  type: object
                  description: Optional retry policy applied at the Envoy route level.
                  properties:
                    numRetries:
                      type: integer
                      minimum: 0
                      default: 2
                    perTryTimeoutMs:
                      type: integer
                      minimum: 0
                      default: 5000
                timeoutMs:
                  type: integer
                  description: Total route timeout in milliseconds (0 = disabled).
                  minimum: 0
                  default: 15000
                rateLimit:
                  type: object
                  description: Optional token-bucket rate limit enforced per route.
                  properties:
                    requestsPerUnit:
                      type: integer
                      minimum: 1
                    unit:
                      type: string
                      enum: [SECOND, MINUTE, HOUR]
                      default: MINUTE
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                xdsSnapshotVersion:
                  type: string
                  description: Version of the last xDS snapshot pushed for this route.
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: ingressroutes
    singular: ingressroute
    kind: IngressRoute
    shortNames:
      - ir
    categories:
      - platform
